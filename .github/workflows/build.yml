
name: Build SiteTest 3.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SiteTest3_1_project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project archive
        run: |
          test -f SiteTest3_1_project.zip
          unzip -o SiteTest3_1_project.zip -d .
          test -f SiteTest3/app/build.gradle
          test -f SiteTest3/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: SiteTest3
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteTest-3.1-APK
          path: SiteTest3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
