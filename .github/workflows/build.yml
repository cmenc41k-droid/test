name: Build SiteTest3_1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SiteTest3_1_project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip SiteTest3_1_project.zip -d .
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: SiteTest3_1
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteTest3_1-APK
          path: SiteTest3_1/app/build/outputs/apk/debug/app-debug.apk
