name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev libltdl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython==0.29.36" virtualenv setuptools

      - name: Clone python-for-android and patch manifest
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git p4a_src
          python tools/patch_p4a_manifest.py

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'android/manifest_extra.xml') }}
          restore-keys: buildozer-

      - name: Syntax check
        run: python -m compileall -q *.py tools

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Verify manifest contains native components
        run: |
          APK=$(ls bin/*.apk | head -1)
          AAPT=$(find "$HOME/.buildozer/android/platform" -name aapt -type f 2>/dev/null | head -1)
          if [ -z "$AAPT" ]; then echo "aapt not found, skipping"; exit 0; fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -E "CaptureService|CapturePermissionActivity|SYSTEM_ALERT_WINDOW" manifest.txt
          grep -q "CaptureService" manifest.txt
          grep -q "CapturePermissionActivity" manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenAssistant-debug-apk
          path: bin/*.apk
          if-no-files-found: error
